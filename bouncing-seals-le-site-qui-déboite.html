<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bouncing Seals 🦭</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Comic Sans MS", cursive;
    background:#eef8ff;
    overflow-x:hidden;
    position:relative;
}

/* 🦭 BACKGROUND */

.seal{
    position:fixed;
    pointer-events:none;
    animation:float linear infinite;
}

@keyframes float{
    0%{transform:translateY(110vh);}
    100%{transform:translateY(-10vh);}
}

/* HEADER */

header{
    text-align:center;
    padding:40px 20px;
    background:linear-gradient(45deg,#4ecdc4,#45b7d1);
    color:white;
}

h1{
    font-size:clamp(2rem,6vw,4rem);
}

/* BUTTONS */

button{
    margin-top:20px;
    margin-right:10px;
    padding:15px 25px;
    border:none;
    border-radius:999px;
    font-size:1.2rem;
    cursor:pointer;
    background:#ff6b6b;
    color:white;
    transition:0.2s;
}

button:hover{
    transform:scale(1.1);
    background:#ff3b3b;
}

.nuclear{
    background:black;
    color:#00ff88;
}

/* SHAKE */

.shake{
    animation:shake 0.4s;
}

@keyframes shake{
    0%{transform:translate(0,0);}
    25%{transform:translate(10px,-10px);}
    50%{transform:translate(-10px,10px);}
    75%{transform:translate(10px,10px);}
    100%{transform:translate(0,0);}
}

/* VIDEOS */

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.video-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.video-wrapper{
    position:relative;
    padding-bottom:56.25%;
}

.video-wrapper iframe{
    position:absolute;
    width:100%;
    height:100%;
    border:none;
    border-radius:15px;
}
</style>
</head>

<body>

<header>
    <h1>🦭 BOUNCING SEALS 🦭</h1>
    <button onclick="spawnMass()">MORE SEALS 🦭💥</button>
    <button class="nuclear" onclick="nuclearSeal()">☢️ NUCLEAR SEAL</button>
</header>

<div class="container">

<div class="video-container">

<div class="video-wrapper">
<iframe src="https://www.youtube.com/embed/A4MU5BXPGcw" allowfullscreen></iframe>
</div>

<div class="video-wrapper">
<iframe src="https://www.youtube.com/embed/VlTo9Z94XQ0" allowfullscreen></iframe>
</div>

<div class="video-wrapper">
<iframe src="https://www.youtube.com/embed/-SjPVVeNdKY" allowfullscreen></iframe>
</div>

<div class="video-wrapper">
<iframe src="https://www.youtube.com/embed/UmW5d0RBxBc" allowfullscreen></iframe>
</div>

<div class="video-wrapper">
<iframe src="https://www.youtube.com/embed/j8Z9eGz8vWk" allowfullscreen></iframe>
</div>

<div class="video-wrapper">
<iframe src="https://www.youtube.com/embed/1uQ6zKzW7j0" allowfullscreen></iframe>
</div>

</div>

</div>

<script>

function createSeal(){
    let seal=document.createElement("div");
    seal.className="seal";
    seal.innerHTML="🦭";

    seal.style.left=Math.random()*100+"vw";
    seal.style.fontSize=(1+Math.random()*2)+"rem";

    let duration=5+Math.random()*10;
    seal.style.animationDuration=duration+"s";

    document.body.appendChild(seal);

    let x=0;
    let speed=(Math.random()-0.5)*2;

    function move(){
        x+=speed;
        seal.style.transform=`translate(${x}px,0)`;
        requestAnimationFrame(move);
    }
    move();
}

// spawn initial
for(let i=0;i<30;i++){
    createSeal();
}

// bouton normal
function spawnMass(){
    for(let i=0;i<200;i++){
        createSeal();
    }
}

// ☢️ nucléaire
function nuclearSeal(){

    document.body.classList.add("shake");
    setTimeout(()=>document.body.classList.remove("shake"),400);

    for(let i=0;i<1000;i++){
        setTimeout(createSeal, i*2);
    }

    alert("☢️ trop de phoques mec ☢️");
}

</script>

</body>
</html>
