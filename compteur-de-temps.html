<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temps Infini Ultimate</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    color:white;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
}

/* GALAXY BACKGROUND */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background:radial-gradient(white 1px, transparent 1px);
    background-size:3px 3px;
    animation:stars 60s linear infinite;
    z-index:-1;
}

@keyframes stars{
    from{transform:translate(0,0)}
    to{transform:translate(-500px,-500px)}
}

/* TIMER */
#timer{
    font-size:2em;
    margin-bottom:10px;
}

/* QUOTE */
#quote{
    font-style:italic;
    opacity:0.8;
    margin-bottom:20px;
}

/* HOURGLASS */
.hourglass{
    position:relative;
    width:140px;
    height:220px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.bulb{
    width:100px;
    height:90px;
    border-radius:50%;
    background:rgba(255,255,255,0.05);
    box-shadow:inset 0 0 20px rgba(255,255,255,0.2);
}

.stream{
    width:6px;
    height:30px;
    background:gold;
    animation:flow 1s linear infinite;
}

@keyframes flow{
    0%{height:0}
    50%{height:30px}
    100%{height:0}
}

/* WATCH */
.watch{
    display:none;
    width:220px;
    height:220px;
    border-radius:50%;
    position:relative;
}

.hand{
    position:absolute;
    top:50%;
    left:50%;
    transform-origin:bottom;
    transform:translate(-50%,-100%);
}

.hour{width:6px;height:50px;background:white;}
.minute{width:4px;height:70px;background:white;}
.second{width:2px;height:90px;background:red;}

/* BUTTONS */
button, select{
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#ffffff20;
    color:white;
    backdrop-filter:blur(10px);
}
</style>
</head>

<body>

<div id="timer">00:00:00</div>
<div id="quote">Le temps file…</div>

<div class="hourglass" id="hourglass">
    <div class="bulb" id="top"></div>
    <div class="stream" id="stream"></div>
    <div class="bulb" id="bottom"></div>
</div>

<div class="watch" id="watch">
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
</div>

<button onclick="switchMode()">⏳ / ⌚</button>

<select onchange="changeWatch(this.value)">
    <option value="gold">💎 Gold</option>
    <option value="silver">⚪ Silver</option>
    <option value="dark">🖤 Dark</option>
</select>

<audio id="sandSound" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b46c3.mp3?filename=sand-falling-110624.mp3">
</audio>
