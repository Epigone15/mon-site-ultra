<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fake ChatGPT 🤖</title>
<link rel="stylesheet" href="styles.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background:#202123;
    color:#ececf1;
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:#171717;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.sidebar h2{
    font-size:1.1em;
    margin-bottom:15px;
}

.new-chat{
    background:#2a2b32;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    text-align:center;
    margin-bottom:20px;
}

.chat-item{
    padding:8px;
    border-radius:6px;
    margin-bottom:5px;
    opacity:0.8;
}

.chat-item:hover{
    background:#2a2b32;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* TOP BAR */
.topbar{
    padding:10px 20px;
    border-bottom:1px solid #2a2b32;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.model{
    background:#2a2b32;
    padding:6px 12px;
    border-radius:6px;
    font-size:0.9em;
}

/* CHAT */
#chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:700px;
    margin:20px auto;
    padding:15px;
    border-radius:10px;
    line-height:1.6;
}

.user{
    background:#303030;
}

.bot{
    background:#444654;
}

/* INPUT */
.input-zone{
    padding:20px;
    border-top:1px solid #2a2b32;
}

.input-box{
    max-width:700px;
    margin:auto;
    display:flex;
    background:#2a2b32;
    border-radius:10px;
    padding:10px;
}

input{
    flex:1;
    background:none;
    border:none;
    color:white;
    font-size:1em;
    outline:none;
}

button{
    background:#10a37f;
    border:none;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
}

/* typing dots */
.typing{
    display:inline-block;
}

.typing span{
    animation: blink 1.4s infinite;
}

.typing span:nth-child(2){ animation-delay:0.2s; }
.typing span:nth-child(3){ animation-delay:0.4s; }

@keyframes blink{
    0%,80%,100%{ opacity:0; }
    40%{ opacity:1; }
}

/* Bouton maison */
.home-button {
    position: fixed;
    top: 10px;
    right: 10px;
    background: #2a2b32;
    padding: 8px 15px;
    border-radius: 8px;
    border: 1px solid #374151;
    color: #ececf1;
    cursor: pointer;
    z-index: 1000;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: all 0.2s;
}

.home-button:hover {
    background: #10a37f;
    color: white;
}
</style>
</head>

<body>
<a href="index.html" class="home-button">🏠</a>

<div class="sidebar">
    <h2>💬 ChatGPT</h2>
    <div class="new-chat">+ Nouvelle conversation</div>
    <div class="chat-item">Discussion bizarre</div>
    <div class="chat-item">IA inutile</div>
    <div class="chat-item">Projet secret</div>
</div>

<div class="main">

<div class="topbar">
    <div>Chat</div>
    <div class="model">GPT-4 🤖</div>
</div>

<div id="chat">
    <div class="message bot">Salut mec. Pose une question inutile 😂</div>
</div>

<div class="input-zone">
    <div class="input-box">
        <input id="question" placeholder="Envoyer un message...">
        <button onclick="repondre()">✈️</button>
    </div>
</div>

</div>

<script>
const reponses = [
    "banane cosmique 🍌",
    "42 mais en pire",
    "je refuse de coopérer",
    "demande à un pigeon 🐦",
    "oui mais non",
    "erreur 418 : je suis une théière",
    "ça dépend du vent",
    "clairement un complot",
    "je pense donc... euh non",
    "réessaye dans 1000 ans",
    "c’est la faute de ton wifi",
    "je dirais… peut-être… ou pas",
    "le gouvernement cache la vérité",
    "je suis fatiguée 😴",
    "ça a aucun sens mec",
    "hmm… suspicious 🤨",
    "le chat a validé 🐱",
    "je consulte mon avocat",
    "chargement... toujours pas",
    "404 cerveau non trouvé",
    "la réponse est dans ton cœur ❤️ (mais il bug)",
    "oui mais seulement le mardi",
    "non mais avec conviction",
    "je lance un dé 🎲 ... résultat : flou",
    "ça a été validé par personne",
    "je préfère ne pas répondre",
    "c’est une excellente mauvaise question",
    "je dirais oui, mais en non",
    "c’est clairement un piège",
    "je vais dire peut-être et fuir",
    "réponse validée par un hamster 🐹",
    "c’est faux mais ça passe",
    "je refuse de réfléchir",
    "ça marche dans ma tête",
    "non mais avec enthousiasme",
    "oui mais j’hésite fort",
    "je pense que j’ai tort",
    "ça dépend de la météo intérieure",
    "erreur : trop de réflexion",
    "je vais faire une sieste",
    "je suis pas payé pour ça",
    "ça me semble légalement douteux",
    "je choisis le chaos",
    "aucune logique détectée",
    "c’est validé par moi-même",
    "je suis en grève 🤖",
    "ça sonne vrai mais non",
    "je vais répondre au hasard : oui",
    "je pense que non, mais bon",
    "ça a été approuvé par personne compétente",
    "je suis 0% sûr",
    "oui mais uniquement dans Fortnite",
    "non mais avec élégance",
    "je viens d’inventer la réponse",
    "je bug un peu là",
    "ça dépend du multivers",
    "je vais dire oui et courir",
    "non mais t’as capté",
    "c’est validé par le conseil des pigeons 🐦",
    "je suis en roue libre",
    "ça me paraît louche",
    "je comprends pas la question mais non",
    "oui mais sans raison",
    "je vais dire non pour l’ambiance"
];

function typeWriter(element, text, speed=20){
    element.textContent = "";
    let i = 0;
    function typing(){
        if(i < text.length){
            element.textContent += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}

function repondre(){
    const input = document.getElementById("question");
    const chat = document.getElementById("chat");

    if(input.value.trim() === "") return;

    // USER MSG
    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = input.value;
    chat.appendChild(userMsg);

    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    // BOT THINKING
    const thinking = document.createElement("div");
    thinking.className = "message bot";
    thinking.innerHTML = '<div class="typing"><span>.</span><span>.</span><span>.</span></div>';
    chat.appendChild(thinking);

    chat.scrollTop = chat.scrollHeight;

    setTimeout(() => {
        chat.removeChild(thinking);

        const botMsg = document.createElement("div");
        botMsg.className = "message bot";
        chat.appendChild(botMsg);

        const rep = reponses[Math.floor(Math.random()*reponses.length)];
        typeWriter(botMsg, rep, 25);

        chat.scrollTop = chat.scrollHeight;
    }, 1000);
}

document.getElementById("question").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        repondre();
    }
});
</script>

</body>
</html>
